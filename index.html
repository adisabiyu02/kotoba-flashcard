function kanaToRomaji(kana) {
    let result = "";
    let i = 0;
    while (i < kana.length) {
        let char = kana[i];
        let nextChar = kana[i+1] || "";
        let combined = char + nextChar;
        
        if (romajiMap[combined]) {
            result += romajiMap[combined]; i += 2;
        } else if (romajiMap[char]) {
            result += romajiMap[char]; i++;
        } else if ((char === 'っ' || char === 'ッ') && nextChar) {
            let nextRomaji = romajiMap[nextChar + (kana[i+2] || "")] || romajiMap[nextChar];
            if (nextRomaji) result += nextRomaji[0];
            i++;
        } else if (char === 'ー' || char === '-') {
            if (result.length > 0) result += result[result.length-1];
            i++;
        } else if (char === '・' || char === ' ') {
            result += ' '; i++;
        } else if (char === '〜' || char === '~') {
            result += '~'; i++;
        } else if (char === '[' || char === ']' || char === '（' || char === '）' || char === '(' || char === ')') {
            result += char; i++;
        } else {
            result += char; i++;
        }
    }
    return result;
}

let currentBab = 1;

function renderCards() {
    const container = document.getElementById('flashcard-grid');
    container.innerHTML = '';

    const currentData = babData[currentBab - 1];

    currentData.forEach(item => {
        const kana = item[0];
        const arti = item[1];
        const romaji = kanaToRomaji(kana);

        const cardHTML = `
        <div class="card group perspective-1000 cursor-pointer w-full aspect-[5/4] sm:h-36" onclick="this.classList.toggle('flipped')">
            <div class="card-inner relative w-full h-full transform-style-3d">
                
                <!-- Sisi Depan -->
                <div class="absolute inset-0 backface-hidden bg-white border border-slate-200 rounded-2xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] flex flex-col items-center justify-center p-3 text-center">
                    <span class="kana-font text-lg sm:text-2xl font-bold text-slate-800 leading-snug px-1">${kana}</span>
                </div>
                
                <!-- Sisi Belakang -->
                <div class="absolute inset-0 backface-hidden rotate-y-180 bg-[#f0fdf4] border-2 border-[#6ee7b7] rounded-2xl shadow-sm flex flex-col items-center justify-center p-3 text-center">
                    <span class="text-xs sm:text-sm italic text-teal-600 mb-1 font-medium">[${romaji}]</span>
                    <span class="text-xs sm:text-sm text-slate-800 font-bold leading-snug px-1">${arti}</span>
                </div>
                
            </div>
        </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
    });

    document.getElementById('bab-title').textContent = `Pelajaran ${currentBab}`;
    document.getElementById('curr-page').textContent = currentBab;
    document.getElementById('tot-page').textContent = babData.length;
    document.getElementById('tot-words').textContent = `(${currentData.length} Kosakata)`;
    
    document.getElementById('btn-prev').disabled = currentBab === 1;
    document.getElementById('btn-next').disabled = currentBab === babData.length;
}

function changeBab(direction) {
    const newBab = currentBab + direction;
    if (newBab >= 1 && newBab <= babData.length) {
        currentBab = newBab;
        renderCards();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

function shuffleArray(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function resetCards() {
    shuffleArray(babData[currentBab - 1]);
    renderCards();
}

function prepareAndPrint() {
    const printContainer = document.getElementById('print-container');
    printContainer.innerHTML = '';
    
    const currentData = babData[currentBab - 1];
    const headerHTML = `<h2 style="text-align:center; font-size: 22px; font-family: sans-serif; margin-bottom: 24px; color: #0f172a;">Daftar Kosakata Pelajaran ${currentBab} (${currentData.length} Kosakata)</h2>`;
    
    const grid = document.createElement('div');
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
    grid.style.gap = '12px';
    
    currentData.forEach((item, index) => {
        const kana = item[0];
        const arti = item[1];
        const romaji = kanaToRomaji(kana);
        
        const cardHTML = `
            <div style="border: 2px solid #e2e8f0; padding: 12px; text-align: center; border-radius: 12px; page-break-inside: avoid; font-family: sans-serif;">
                <div style="font-size: 11px; color: #94a3b8; text-align: left; margin-bottom: 4px;">#${index + 1}</div>
                <div style="font-size: 18px; font-weight: bold; margin-bottom: 6px; font-family: 'Noto Sans JP', sans-serif; color: #1e293b;">${kana}</div>
                <div style="font-size: 11px; color: #0d9488; margin-bottom: 4px; font-style: italic;">[${romaji}]</div>
                <div style="font-size: 12px; font-weight: bold; color: #0f172a;">${arti}</div>
            </div>
        `;
        grid.insertAdjacentHTML('beforeend', cardHTML);
    });
    
    printContainer.insertAdjacentHTML('afterbegin', headerHTML);
    printContainer.appendChild(grid);
    
    setTimeout(() => {
        window.print();
    }, 400);
}

function showToast(message) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-message').textContent = message;
    toast.classList.remove('opacity-0');
    setTimeout(() => {
        toast.classList.add('opacity-0');
    }, 3000);
}

function shareApp() {
    if (navigator.share) {
        navigator.share({
            title: `Flashcard Kotoba - Pelajaran ${currentBab}`,
            text: `Latihan Flashcard Kotoba Pelajaran ${currentBab} Minna no Nihongo.`,
            url: window.location.href
        }).catch(err => console.log(err));
    } else {
        try {
            const tempInput = document.createElement('input');
            tempInput.value = window.location.href;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast("Link berhasil disalin!");
        } catch (err) {
            showToast("Browser tidak mendukung fitur ini.");
        }
    }
}

renderCards();
